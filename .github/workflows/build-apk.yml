name: Build Debug APK

# Builds a debug APK on every push and keeps exactly one artifact per
# branch/issue: a new push replaces the artifact left by the previous push
# on the same branch instead of accumulating a new one each time.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :yaacc:assembleDebug --no-daemon

      - name: Determine artifact name
        id: artifact-name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          issue_num=$(printf '%s' "$BRANCH" | grep -oiE 'issue[-_]?[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          if [ -n "$issue_num" ]; then
            name="apk-issue-${issue_num}"
          else
            safe_branch=$(printf '%s' "$BRANCH" | tr -c 'a-zA-Z0-9._-' '-')
            name="apk-branch-${safe_branch}"
          fi
          echo "Resolved artifact name: $name"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "issue-number=${issue_num}" >> "$GITHUB_OUTPUT"

      - name: Delete previous artifact for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.name }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" --jq '.artifacts[].id')
          for id in $ids; do
            echo "Deleting previous artifact id $id named $ARTIFACT_NAME"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: yaacc/build/outputs/apk/debug/yaacc-debug.apk
          overwrite: true
          if-no-files-found: error

      - name: Comment on issue with build link
        if: steps.artifact-name.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.artifact-name.outputs.issue-number }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          marker="<!-- apk-build-artifact:issue-${ISSUE_NUMBER} -->"
          short_sha="${SHA:0:7}"
          timestamp=$(date -u +"%Y-%m-%d %H:%M UTC")
          body=$(cat <<EOF
          ${marker}
          **Debug APK build updated**

          Branch \`${BRANCH}\`, commit \`${short_sha}\`, built ${timestamp}.

          Download: open the [workflow run](${RUN_URL}), then grab the \`${ARTIFACT_NAME}\` artifact listed under that run. Downloading requires being signed in to GitHub. This replaces the previous build for this branch and expires after 90 days.
          EOF
          )

          existing_id=$(MARKER="$marker" gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | startswith(env.MARKER)) | .id' | head -n1)

          if [ -n "$existing_id" ]; then
            echo "Updating existing comment $existing_id on issue #${ISSUE_NUMBER}"
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing_id}" -f body="$body"
          else
            echo "Creating new comment on issue #${ISSUE_NUMBER}"
            gh api --method POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" -f body="$body"
          fi
