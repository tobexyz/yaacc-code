name: Build Debug APK

# Builds a debug APK on every push and keeps exactly one artifact per
# branch/issue: a new push replaces the artifact left by the previous push
# on the same branch instead of accumulating a new one each time.

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :yaacc:assembleDebug --no-daemon

      - name: Determine artifact name
        id: artifact-name
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          issue_num=$(printf '%s' "$BRANCH" | grep -oiE 'issue[-_]?[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)
          if [ -n "$issue_num" ]; then
            name="apk-issue-${issue_num}"
          else
            safe_branch=$(printf '%s' "$BRANCH" | tr -c 'a-zA-Z0-9._-' '-')
            name="apk-branch-${safe_branch}"
          fi
          echo "Resolved artifact name: $name"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "issue-number=${issue_num}" >> "$GITHUB_OUTPUT"

      - name: Delete previous artifact for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.name }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" --jq '.artifacts[].id')
          for id in $ids; do
            echo "Deleting previous artifact id $id named $ARTIFACT_NAME"
            gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: yaacc/build/outputs/apk/debug/yaacc-debug.apk
          overwrite: true
          if-no-files-found: error

      - name: Comment on issue with build link (first time only)
        if: steps.artifact-name.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.artifact-name.outputs.issue-number }}
          ARTIFACT_NAME: ${{ steps.artifact-name.outputs.name }}
          RUNS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/build-apk.yml?query=branch%3A${{ github.ref_name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          marker="<!-- apk-build-artifact:issue-${ISSUE_NUMBER} -->"

          existing_id=$(MARKER="$marker" gh api "repos/${REPO}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            --jq '.[] | select(.body | startswith(env.MARKER)) | .id' | head -n1)

          if [ -n "$existing_id" ]; then
            echo "Comment already posted on issue #${ISSUE_NUMBER} (id $existing_id); not posting again."
            exit 0
          fi

          body=$(cat <<EOF
          ${marker}
          **Debug APK builds for this branch**

          Every push to \`${BRANCH}\` builds a debug APK and uploads it as the \`${ARTIFACT_NAME}\` artifact, always under that same name (each push replaces the previous one).

          To get the latest build: open the [workflow runs for this branch](${RUNS_URL}), pick the most recent successful run, and download the \`${ARTIFACT_NAME}\` artifact from its Artifacts section. Downloading requires being signed in to GitHub.

          This comment is posted once and won't be updated on later pushes - the artifact name above always points at the current build.
          EOF
          )

          echo "Creating new comment on issue #${ISSUE_NUMBER}"
          gh api --method POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" -f body="$body"
