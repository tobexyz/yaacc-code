# FCast test receiver for YAACC (issue #327). Linux only: it uses the host network, because the bridge network of Docker
# does not carry mDNS multicast, so the phone would not find the receiver. On Windows and macOS run fcast_rig.py natively
# (README.md). Change the name or the address below; the address is the notebook's address on the Wi-Fi/LAN.
services:
  fcast-rig:
    build: .
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # --address: the notebook's IPv4 address on the network the phone is in (find it with: ip -4 addr)
    command: ["--host", "0.0.0.0", "--port", "46899", "--name", "FCast-rig", "--address", "192.168.1.50", "-v"]
