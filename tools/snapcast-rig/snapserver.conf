# Snapserver configuration for the YAACC test rig (LOCAL TESTING ONLY).
#
# Mounted read-only at /etc/snapserver/snapserver.conf and read by
# "snapserver -c /etc/snapserver/snapserver.conf". Key names follow the
# Snapcast sample config (server/etc/snapserver.conf). Comments are on their
# own lines on purpose: do not append comments to a value.

[server]
# Persistent state (server.json: groups, client names, volumes). The container
# root file system is read-only and /tmp is a tmpfs, so the rig starts fresh on
# every "docker compose up". Snapserver creates the directory itself.
datadir = /tmp/snapserver
# The image is built with BUILD_WITH_AVAHI=OFF, mDNS publishing is compiled out.
# Set explicitly so a rebuild with Avahi does not start advertising the rig.
mdns_enabled = false

[authorization]
# No authentication on any interface. This is only acceptable because
# docker-compose.yml publishes every port on 127.0.0.1 only.
enabled = false

[http]
# HTTP JSON-RPC (POST /jsonrpc) and websocket control on port 1780.
# No doc_root: the Snapweb UI is not installed in the image.
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp-control]
# Newline-delimited JSON-RPC 2.0 over plain TCP, port 1705. This is the
# interface YAACC's control library talks to. 0.0.0.0 is the container-internal
# address; the host side of the port mapping is 127.0.0.1.
enabled = true
bind_to_address = 0.0.0.0
port = 1705
publish = false

[tcp-streaming]
# Binary stream protocol for snapclients, port 1704.
enabled = true
bind_to_address = 0.0.0.0
port = 1704
publish = false

[stream]
# One static source: a named pipe created by snapserver at startup (mode=create
# is the default for pipe sources). Format and codec are set explicitly so the
# rig does not depend on the version's defaults:
#   name         stream id shown in Server.GetStatus ("Default")
#   sampleformat <rate>:<bits>:<channels>, the format every producer must write
#   codec        transport codec towards the clients (flac = lossless)
source = pipe:///tmp/snapfifo?name=Default&sampleformat=48000:16:2&codec=flac

# Streams added at runtime with Stream.AddStream need no entry here. The RPC
# interface may add pipe, file, tcp, alsa, jack and meta sources (doc/json_rpc_api/control.md).
# A "tcp://0.0.0.0:<port>?name=..&mode=server" source listens inside the
# container; only ports 4953-4962 are published to the host by docker-compose.yml,
# so use a port from that range. YAACC and the spike pick the first free one.

# Defaults for all sources, written out so the rig behaves the same on every version.
sampleformat = 48000:16:2
codec = flac
# Read chunk size [ms]; also the pacing unit for producers.
chunk_ms = 20
# End-to-end latency [ms] from reading a sample on the server to playing it on
# a client. Pause/stop/seek become audible only after this delay.
buffer = 1000
# Do not send audio to muted clients.
send_to_muted = false

[streaming_client]
# Volume a never-seen client gets on its first connect.
initial_volume = 100

[logging]
# Container logs go to "docker compose logs snapserver". Stream state changes
# ("State changed: ... idle => playing") and Stream.AddStream calls are INFO.
sink = stdout
filter = *:info
