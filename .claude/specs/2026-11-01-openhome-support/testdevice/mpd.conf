# MPD for the OpenHome test device (see README.md)
music_directory     "/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/database"
state_file          "/var/lib/mpd/state"

# upmpdcli runs on the same (host) network: nothing else needs to reach MPD. The port is not the default one, so that an MPD
# on the host does not collide with this one.
bind_to_address     "127.0.0.1"
port                "6610"

# no Avahi in the container
zeroconf_enabled    "no"

# No sound card: the null output plays in real time and throws the audio away. The software mixer makes volume and mute work.
audio_output {
    type            "null"
    name            "Null output"
    mixer_type      "software"
}

