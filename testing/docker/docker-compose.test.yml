version: '3.8'
services:
  # UPnP Media Server
  gerbera:
    image: gerbera/gerbera
    container_name: yaacc-gerbera
    network_mode: host
    volumes:
      - ../test-media:/content:ro
      - ./gerbera:/var/lib/gerbera
    restart: unless-stopped

  # UPnP Renderer (gmrender-resurrect)
  upnp-renderer:
    image: giof71/gmrender-resurrect
    container_name: yaacc-upnp-renderer
    network_mode: host
    environment:
      - FRIENDLY_NAME=Test UPnP Renderer
      - UPNP_DEVICE_UUID=12345678-1234-1234-1234-123456789abc
    restart: unless-stopped

  # Android test runner
  android-test:
    build:
      context: ./android-test
      dockerfile: Dockerfile
    container_name: yaacc-test
    volumes:
      - ../../yaacc/build/outputs/apk/debug/yaacc-debug.apk:/workspace/yaacc-debug.apk:ro
      - ../../yaacc/build/outputs/apk/androidTest/debug/yaacc-debug-androidTest.apk:/workspace/yaacc-test.apk:ro
      - ./android-test:/scripts:ro
      - /dev/kvm:/dev/kvm
    privileged: true
    network_mode: host
    depends_on:
      - gerbera
      - upnp-renderer
