buildscript {

    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'

    }
}


apply plugin: 'com.android.application'

dependencies {

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'com.tngtech.junit.dataprovider:junit4-dataprovider:2.12'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:5.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    // httpclient5 pinned below the Dependabot-bumped 5.6.5: its own
    // DefaultHttpClientConnectionOperator class (confirmed via direct
    // bytecode inspection - this is httpclient5's own code, not httpcore5's)
    // gained a static initializer that calls jdk.net.Sockets/ExtendedSocketOptions
    // (hidden JDK APIs) to probe TCP keepalive support, which Android's ART
    // blocks for app code, crashing at class-init time with NoSuchMethodError
    // on every real device. 5.2.1 predates this.
    // See https://github.com/Adyen/adyen-java-api-library/issues/1671
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.2.1'
    // httpcore5 kept at a patched version (NOT reverted alongside httpclient5):
    // versions before 5.4.3 are vulnerable to CVE-2026-54399 (HTTP/1.1
    // header-parsing memory-exhaustion DoS) - a real attack surface here,
    // since this is yaacc's actual HTTP transport for talking to other UPnP
    // devices on the LAN (HttpRequestSender). The Android-crashing code
    // above lives in httpclient5 itself, not httpcore5, so pairing a
    // patched httpcore5 with the reverted httpclient5 avoids both issues.
    implementation 'org.apache.httpcomponents.core5:httpcore5:5.4.4'
    // httpclient5 also transitively pulls httpcore5-h2 (HTTP/2 support,
    // including the HPACK decoder CVE-2026-54428 targets) - without this
    // explicit pin it stays at the vulnerable 5.2 even though plain
    // httpcore5 above gets bumped, since Gradle only overrides a module
    // it's told about.
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.4.4'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation('androidx.mediarouter:mediarouter:1.8.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'org.mp4parser:isoparser:1.9.56'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

}

android {
    compileSdk 36


    sourceSets {

        // Move the tests to tests/java, tests/res, etc...
        //instrumentTest.setRoot('tests')

        // Move the build types to build-types/<type>
        // For instance, build-types/debug/java, build-types/debug/AndroidManifest.xml, ...
        // This moves them out of them default location under src/<type>/... which would
        // conflict with src/ being used by the main source set.
        // Adding new build types or product flavors should be accompanied
        // by a similar customization.
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/beans.xml', 'META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/DEPENDENCIES']
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    androidResources {
        generateLocaleConfig false
    }

    defaultConfig {
        resourceConfigurations += ["en", "de", "nl", "fr", "pt", "es", "zh"]
        targetSdkVersion 33
        minSdkVersion 27
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace 'de.yaacc'

}
