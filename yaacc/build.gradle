buildscript {

    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'

    }
}


apply plugin: 'com.android.application'

dependencies {

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.24.0'
    testImplementation 'com.tngtech.junit.dataprovider:junit4-dataprovider:2.12'
    testImplementation 'xmlpull:xmlpull:1.1.3.1'
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
    implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:5.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    // httpclient5/httpcore5/httpcore5-h2 pinned to the NEWEST versions that
    // predate a shared Android incompatibility: both httpclient5's
    // DefaultHttpClientConnectionOperator and httpcore5's ReflectionUtils
    // gained a static initializer in their 5.4 line that calls
    // jdk.net.Sockets/ExtendedSocketOptions (hidden JDK APIs) to probe TCP
    // keepalive support - confirmed via direct bytecode inspection across
    // versions. Android's ART blocks these hidden APIs for app code, so
    // merely loading either class crashes with NoSuchMethodError on every
    // real device. Confirmed boundaries: httpclient5 5.3.1 and httpcore5
    // 5.3.6 are the newest clean versions (zero jdk/net references); 5.4
    // (not just later patch releases) is where each library's rewrite
    // landed. See https://github.com/Adyen/adyen-java-api-library/issues/1671
    //
    // KNOWN RESIDUAL RISK, not fixed by this pin: httpcore5 CVE-2026-54399
    // (HTTP/1.1 header-parsing memory-exhaustion DoS) and CVE-2026-54428
    // (HTTP/2 HPACK decoder DoS, via httpcore5-h2), both fixed only in
    // 5.4.3+ - which has the same Android-crashing probe. No upstream
    // release satisfies both constraints (confirmed: 5.3.6 is explicitly
    // still vulnerable to both CVEs, no 5.3.x backport exists). This
    // affects yaacc's embedded UPnP HTTP server's exposure to a
    // malicious/compromised device on the LAN. Deliberately accepted for
    // now to keep the app usable; see decisions.md in
    // .claude/specs/2026-10-17-browse-card-grid-view/ for the full
    // tradeoff and follow-up options (shim ReflectionUtils locally, or
    // move the embedded server off httpcore5's reactor stack).
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    implementation 'org.apache.httpcomponents.core5:httpcore5:5.3.6'
    implementation 'org.apache.httpcomponents.core5:httpcore5-h2:5.3.6'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.media3:media3-session:1.11.1'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation('androidx.mediarouter:mediarouter:1.8.0') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.4.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'org.mp4parser:isoparser:1.9.56'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

}

android {
    compileSdk 36


    sourceSets {

        // Move the tests to tests/java, tests/res, etc...
        //instrumentTest.setRoot('tests')

        // Move the build types to build-types/<type>
        // For instance, build-types/debug/java, build-types/debug/AndroidManifest.xml, ...
        // This moves them out of them default location under src/<type>/... which would
        // conflict with src/ being used by the main source set.
        // Adding new build types or product flavors should be accompanied
        // by a similar customization.
        debug.setRoot('build-types/debug')
        release.setRoot('build-types/release')
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/beans.xml', 'META-INF/NOTICE.md', 'META-INF/LICENSE.md', 'META-INF/DEPENDENCIES']
        }

    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    androidResources {
        generateLocaleConfig false
    }

    defaultConfig {
        resourceConfigurations += ["en", "de", "nl", "fr", "pt", "es", "zh"]
        targetSdkVersion 33
        minSdkVersion 27
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace 'de.yaacc'

}
